name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          archives: qtsvg
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage application
        shell: pwsh
        run: |
          cmake --install build --prefix package --config Release
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release "package\kadris-studio.exe"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KadrisStudio-Windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14
